pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '7.2.2'
        id 'org.jetbrains.kotlin.android' version '1.9.22'
    }
}

def publication = providers.gradleProperty('ktoastPublication').getOrElse('candidate')
if (!(publication in ['candidate', 'staging'])) {
    throw new GradleException('ktoastPublication must be candidate or staging')
}

dependencyResolutionManagement {
    repositories {
        maven { url = new File(settingsDir, '../../../build/' + publication + '-repository') }
        google()
        mavenCentral()
    }
}

rootProject.name = 'ktoast-android-consumer'
